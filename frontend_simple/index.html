<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockIt</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>StockIt</h1>
      <p>AEDS3</p>
    </header>

    <main id="app">
      <!-- Tela Inicial -->
      <div id="tela-inicial" class="tela">
        <h2>Entidades</h2>
        <div class="entidades-grid">
          <button
            class="btn-entidade"
            onclick="navegarEntidade('CategoriaAlimento')"
          >
            <span class="icon">📁</span>
            <span>Categoria Alimento</span>
          </button>
          <button class="btn-entidade" onclick="navegarEntidade('Alimento')">
            <span class="icon">🍎</span>
            <span>Alimento</span>
          </button>
          <button class="btn-entidade" onclick="navegarEntidade('Ambiente')">
            <span class="icon">🏠</span>
            <span>Ambiente</span>
          </button>
        </div>
      </div>

      <!-- Tela da Entidade -->
      <div id="tela-entidade" class="tela hidden">
        <button class="btn-voltar" onclick="voltarInicio()">← voltar</button>
        <h2 id="titulo-entidade"></h2>

        <div class="acoes-bar">
          <button class="btn-acao active" onclick="setTab('listagem')">
            Listagem
          </button>
          <button class="btn-acao" onclick="setTab('criar')">+ Novo</button>
          <button class="btn-acao" onclick="setTab('hash')">Hash</button>
          <button class="btn-acao" onclick="setTab('encoding')">
            Codificação
          </button>
        </div>

        <div id="tab-content"></div>
      </div>
    </main>

    <footer>
      <p>Arthur Tristão · Davi Godoi · Augusto Bizzaria - 2026</p>
    </footer>

    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
